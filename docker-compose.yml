services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: puzzlecut
      POSTGRES_PASSWORD: puzzlecut
      POSTGRES_DB: puzzlecut
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puzzlecut -d puzzlecut"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://puzzlecut:puzzlecut@postgres:5432/puzzlecut
      STORAGE_DIR: /data
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      MAX_UPLOAD_MB: "15"
      LOG_LEVEL: INFO
    volumes:
      - puzzledata:/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  puzzledata:
