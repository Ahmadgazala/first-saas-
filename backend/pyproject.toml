[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "puzzlecut-backend"
version = "0.1.0"
description = "PuzzleCut AI - image to laser-cut slot-together 3D puzzle generator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.3",
    "shapely>=2.1",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "trimesh>=4.4",
    "fast-simplification>=0.1",
    "ezdxf>=1.3",
    "reportlab>=4.2",
]

[project.optional-dependencies]
# AI background removal (rembg / IS-Net) and photo -> 3D reconstruction (TripoSR).
# Without these extras the app still works: photos use classical segmentation and the
# estimated body; uploaded 3D models are always sliced exactly.
ai = [
    "torch>=2.2",
    "transformers>=4.40,<5",
    "omegaconf>=2.3",
    "einops>=0.7",
    "huggingface-hub>=0.23",
    "rembg>=2.0.57",
    "onnxruntime>=1.17",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pypdf>=4.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not ai'"
markers = ["ai: needs the AI models (rembg / TripoSR weights); run with -m ai"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx`"]
